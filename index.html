<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        try {
          var originalFetch = typeof window !== 'undefined' && window.fetch ? window.fetch.bind(window) : function() { return Promise.reject(new Error('fetch not available')); };
          var currentFetch = originalFetch;

          var fetchDescriptor = {
            get: function() {
              return currentFetch;
            },
            set: function(fn) {
              currentFetch = fn;
            },
            configurable: true,
            enumerable: true
          };

          try {
            Object.defineProperty(window, 'fetch', fetchDescriptor);
          } catch (e1) {}

          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', fetchDescriptor);
            } catch (e2) {}
          }
        } catch (e) {
          // ignore
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/images/logo/logodef.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>B2B Group | Forniture e attrezzature per aziende</title>
    <meta name="description" content="Fornitore unico per informatica, arredo ufficio, ristorazione e cancelleria aziendale.">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
